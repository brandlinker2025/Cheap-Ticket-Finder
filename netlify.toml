[build]
  command = "echo shipping-structured-links && true"
  publish = "."
  # Never skip: production deploys after PR merges were skipped (state=error, skipped=true).
  ignore = "exit 1"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Deploy-Stamp = "cheap-ticket-finder-20260902"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Deploy-Stamp = "cheap-ticket-finder-20260902"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Deploy-Stamp = "cheap-ticket-finder-20260902"

[[redirects]]
  from = "/travel-sim"
  to = "/esim/"
  status = 301

[[redirects]]
  from = "/travel-sim/"
  to = "/esim/"
  status = 301

[[redirects]]
  from = "/transfers"
  to = "/airport-transfer/"
  status = 301

[[redirects]]
  from = "/transfers/"
  to = "/airport-transfer/"
  status = 301
