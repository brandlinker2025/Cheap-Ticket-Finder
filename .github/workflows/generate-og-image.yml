name: Generate og-image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/generate_og_image.py, .github/workflows/generate-og-image.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-poppins || sudo apt-get install -y fonts-noto-core
      - run: pip install pillow
      - run: python scripts/generate_og_image.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/og-image.png
          git diff --cached --quiet || git commit -m "Generate og-image.png (1200x630 share preview)"
          git push
